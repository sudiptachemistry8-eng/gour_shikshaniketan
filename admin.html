<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gour Shikshaniketan — Notice Admin</title><link rel="stylesheet" href="admin.css"></head><body><main><header><h1>গৌর শিক্ষানিকেতন</h1><p>অনলাইন নোটিশ অ্যাডমিন প্যানেল</p><a href="./">← মূল ওয়েবসাইট</a></header><section class="panel"><label>Google Apps Script Web App URL<input id="api" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Admin Secret Token<input id="token" type="password" autocomplete="off" placeholder="আপনার গোপন Admin Token"></label><div class="actions"><button id="connect">সংযোগ ও নোটিশ লোড</button><span id="status">প্রথমে Backend সেটআপ করুন।</span></div></section><section class="panel"><h2 id="formHeading">নতুন নোটিশ</h2><form id="noticeForm"><input type="hidden" id="editId"><div class="grid"><label>তারিখ<input id="date" type="date" required></label><label>বিভাগ<select id="category"><option value="general">সাধারণ</option><option value="exam">পরীক্ষা</option><option value="holiday">ছুটি</option><option value="admission">ভর্তি</option><option value="event">অনুষ্ঠান</option></select></label></div><label>বাংলা শিরোনাম<input id="title_bn" required></label><label>বাংলা বিবরণ<textarea id="body_bn" required rows="3"></textarea></label><label>English title (optional)<input id="title_en"></label><label>English description (optional)<textarea id="body_en" rows="3"></textarea></label><label>PDF / Attachment URL (optional)<input id="file" type="url"></label><label class="check"><input id="pinned" type="checkbox"> গুরুত্বপূর্ণ নোটিশ হিসেবে Pin করুন</label><div class="actions"><button type="submit">Publish / Save</button><button type="button" class="secondary" id="reset">নতুন নোটিশ</button></div></form></section><section class="panel"><div class="actions"><h2>প্রকাশিত নোটিশ</h2><button id="refresh" class="secondary">Refresh</button></div><div id="list">এখনও লোড করা হয়নি।</div></section><p class="warning">নিরাপত্তা: Admin Token কাউকে দেবেন না। Public website-এ ব্যক্তিগত ছাত্র-তথ্য বা সংবেদনশীল নথি প্রকাশ করবেন না।</p></main><iframe name="gasResult" id="gasResult" hidden></iframe><script src="admin.js"></script></body></html>
